[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publication-cem"
version = "0.1.0"
description = "Dual-path privacy protection for collaborative face inference"
readme = "README.md"
authors = [
  {name = "Yixuan Zhang"},
  {name = "Jianfeng Ren"},
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=9,<12",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
evaluation = [
  "facenet-pytorch==2.6.0",
  "lpips==0.1.4",
  "scipy>=1.10,<2",
]
analysis = ["matplotlib==3.9.2", "pandas==2.2.3"]
figures = ["CairoSVG>=2.7,<3", "playwright>=1.45,<2"]
preparation = ["opencv-python-headless==4.8.1.78"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
target-version = "py310"
exclude = ["archive"]

[tool.ruff.lint.per-file-ignores]
# These two entry points add the local src directory before importing the package,
# so they remain directly runnable from an unpacked publication archive.
"scripts/train_target.py" = ["E402"]
"scripts/train_attack.py" = ["E402"]
"scripts/build_face_identity_protocol.py" = ["E402"]
"scripts/build_torchvision_protocol.py" = ["E402"]
"scripts/profile_checkpoint.py" = ["E402"]
"scripts/prefetch_evaluation_assets.py" = ["E402"]
"scripts/smoke_attack_suite.py" = ["E402"]
"scripts/smoke_facescrub_mechanism.py" = ["E402"]
"scripts/generate_runbooks.py" = ["E402"]
"scripts/smoke_evaluation_pipeline.py" = ["E402"]
"scripts/verify_official_cem_equivalence.py" = ["E402"]
"scripts/diagnose_channel_tradeoff.py" = ["E402"]
"scripts/calibrate_channel_noise.py" = ["E402"]
"scripts/generate_publication_figures.py" = ["E402"]
"scripts/recover_legacy_facescrub_utility.py" = ["E402"]
